<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning brief · Sales Desk Pay</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="eyebrow" id="date"></span>
    <div class="grow"></div>
    <nav class="nav"><a data-link href="/board">Order board</a><a data-link href="/phone" id="phoneLink">Demo phone</a></nav>
  </header>

  <section style="display:flex;flex-direction:column;gap:12px;max-width:840px">
    <h1 class="big" id="hello" style="font-size:52px;line-height:1.02">Good morning.</h1>
    <p id="headline" style="margin:0;font-size:19px;color:var(--ink-2)"></p>
  </section>

  <section class="tiles" aria-label="Numbers">
    <div class="tile dark"><span>Paid by PayPal since yesterday</span><b id="sold">£0</b></div>
    <div class="tile"><span>Awaiting PayPal</span><b id="waiting" style="color:var(--green)">£0</b></div>
    <div class="tile"><span>Follow-ups today</span><b id="followCount">0</b></div>
    <div class="tile"><span>Waiting on you</span><b id="needsCount" style="color:var(--orange)">0</b></div>
  </section>

  <div class="row">
    <section class="main" aria-label="Needs you">
      <h2 style="font-size:24px;margin-bottom:4px">Needs you</h2>
      <div id="needs" style="display:flex;flex-direction:column;gap:10px"></div>
    </section>
    <div class="side">
      <section class="panel" aria-label="Follow-ups">
        <h2 style="font-size:20px">The robot follows up today</h2>
        <div id="follows"></div>
      </section>
    </div>
  </div>

  <section style="display:flex;flex-direction:column;gap:12px" aria-label="Channels">
    <h2 style="font-size:24px">Where the chats came from</h2>
    <div class="chans" id="chans"></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const K = new URLSearchParams(location.search).get("k");
const withKey = (p) => K ? p + (p.includes("?") ? "&" : "?") + "k=" + encodeURIComponent(K) : p;
document.querySelectorAll("[data-link]").forEach((a) => a.href = withKey(a.getAttribute("href")));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (id) => document.getElementById(id);

async function api(path, body) {
  const r = await fetch(withKey(path), body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }

function needCard(n) {
  let acts = "";
  if (n.kind === "approval") acts = `<button class="btn green" data-act="approve" data-order="${n.order_id}">Approve PayPal link</button><a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="${withKey("/board?c=" + n.customer_id)}">See chat</a>`;
  if (n.kind === "handoff") acts = `<a class="btn dark" style="display:inline-flex;align-items:center;color:#fff;text-decoration:none" href="${withKey("/board?c=" + n.customer_id)}">Reply</a><button class="btn" data-act="robot" data-customer="${n.customer_id}">Let the robot handle it</button>`;
  return `<div class="need"><div class="txt"><span class="meta">${esc(n.channel)} · ${esc(n.when)}</span><span class="title">${esc(n.title)}</span><span class="detail">${esc(n.detail)}</span></div><div class="acts">${acts}</div></div>`;
}

function render(b) {
  $("date").textContent = `${b.shop.toUpperCase()} · ${b.date} · ${b.paypal === "mock" ? "MOCK PAYPAL" : "PAYPAL " + b.paypal.toUpperCase()}`;
  $("hello").textContent = `${b.greeting}, ${b.owner}.`;
  $("headline").textContent = b.headline;
  $("sold").textContent = b.sold;
  $("waiting").textContent = b.waiting;
  $("followCount").textContent = b.follow_count;
  $("needsCount").textContent = b.needs_count;
  $("needs").innerHTML = b.needs.length ? b.needs.map(needCard).join("") : `<div class="empty">Nothing is waiting on you. The robot has it.</div>`;
  $("follows").innerHTML = b.follows.length ? b.follows.map((f) => `<div class="line ${f.skipped ? "skipped" : ""}"><span class="when">${esc(f.time)}</span><span class="who"><b>${esc(f.name)}</b><span>${f.skipped ? "Skipped today" : esc(f.about)}</span></span><button class="btn" data-act="skip" data-order="${f.order_id}" data-skip="${f.skipped ? 0 : 1}" aria-label="${f.skipped ? "Undo skip for" : "Skip follow-up for"} ${esc(f.name)}">${f.skipped ? "Undo" : "Skip"}</button></div>`).join("") : `<span class="meta">No follow-ups due today.</span>`;
  $("chans").innerHTML = b.channels.map((c) => `<div class="chan"><span style="display:flex;align-items:center;gap:8px;font-weight:600"><span class="dot ${c.key}"></span>${esc(c.name)}</span><b>${c.chats} chat${c.chats === 1 ? "" : "s"}</b><span class="meta">${esc(c.sold)}</span></div>`).join("");
}

async function load() {
  try { render(await api("/api/brief")); } catch (e) { toast("Can't reach the desk right now."); }
}

document.addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  b.disabled = true;
  const { act, order, customer } = b.dataset;
  try {
    if (act === "approve") { await api(`/api/order/${order}/approve`, {}); toast("Approved. The PayPal link is on its way to the customer."); }
    if (act === "robot") { await api(`/api/customer/${customer}/robot`, {}); toast("The robot has this chat."); }
    if (act === "skip") { await api(`/api/order/${order}/skip`, { skip: b.dataset.skip === "1" }); }
  } catch (err) { toast("That didn't work. Try again."); }
  load();
});

fetch(withKey("/phone"), { method: "HEAD" }).then((r) => { if (!r.ok) $("phoneLink").remove(); }).catch(() => $("phoneLink").remove());
load();
setInterval(load, 4000);
</script>
</body>
</html>
