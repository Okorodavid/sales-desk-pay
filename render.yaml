services:
  - type: web
    name: sales-desk-pay
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m salesdesk serve
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PROVIDER
        value: rules          # keyless demo brain; set gemini or muse with its key for open-ended chat
      - key: DEMO_KEY
        generateValue: true   # every screen needs ?k=<this key>
      - key: PUBLIC_URL
        sync: false           # https://<this service>.onrender.com, no slash at the end
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
